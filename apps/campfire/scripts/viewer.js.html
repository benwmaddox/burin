<script>(function(){var meta=function(n){var e=document.querySelector('meta[name="'+n+'"]');return e?e.content:null};if(!meta("current-user-id"))return;
window.burinDecorate=function(){var me=meta("current-user-id"),admin=meta("current-user-role")==="administrator";
document.querySelectorAll(".message[data-user-id]").forEach(function(m){var mine=m.dataset.userId===me;if(mine)m.classList.add("message--me");if(mine||admin)m.querySelectorAll(".message__edit").forEach(function(e){e.hidden=false})});
document.querySelectorAll(".boost__remove").forEach(function(f){if(f.dataset.boosterId===me)f.hidden=false})};window.burinDecorate();
window.burinReading=function(){var r=meta("current-room-id");if(r)document.querySelectorAll('#user_sidebar a[href="/rooms/'+r+'"]').forEach(function(a){a.classList.remove("unread")})};window.burinReading();
if(!window.burinHooked){window.burinHooked=true;document.addEventListener("turbo:frame-load",function(e){if(e.target.id==="user_sidebar")window.burinReading()});
document.addEventListener("turbo:before-stream-render",function(e){var render=e.detail.render;e.detail.render=function(el){render(el);window.burinDecorate()}})}})()</script>
