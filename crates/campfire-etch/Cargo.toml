[package]
name = "campfire-etch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Campfire with fragments generated by etchc (LLVM IR), swapped in one at a time against the golden pages"

[dependencies]
etch-rt = { path = "../etch-rt" }
rusqlite = { version = "0.32", features = ["bundled"] }
arc-swap = "1"
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"
p256 = { version = "0.13", features = ["arithmetic"] }
