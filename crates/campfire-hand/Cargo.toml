[package]
name = "campfire-hand"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Phase 1a: Campfire's room page and post_message, written by hand as the compiler should generate them"

[dependencies]
etch-rt = { path = "../etch-rt" }
rusqlite = { version = "0.32", features = ["bundled"] }
arc-swap = "1"
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"
p256 = { version = "0.13", features = ["arithmetic"] }
